version: "3.9"

services:

  # PostgreSQL — operational data (assets, alerts)
  postgres:
    image: postgres:16-alpine
    container_name: signalflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: signalflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ClickHouse — analytics data (readings time series)
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: signalflow-clickhouse
    ports:
      - "9000:9000"   # native protocol (Go driver)
      - "8123:8123"   # HTTP interface (browser/curl)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NATS JetStream — message broker
  nats:
    image: nats:2.10-alpine
    container_name: signalflow-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # monitoring dashboard
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  clickhouse_data:
  nats_data:
